<script type="module">
// ── render.js ───────────────────────────────────────────────────────
// ===========================================================================
// Markdown → HTML render layer (v2.22)
//
// This is an ANCHORING SURFACE, not an Obsidian replica. Its job is to give
// the editor a DOM whose every block knows exactly which source lines it came
// from, so an annotation maps back to a line range with no text matching and
// no orphan class of bugs. Fidelity beyond that is explicitly a non-goal:
// wikilinks, embeds, Dataview, and setext headings render as literal text.
//
// Dependency-free by project convention. Block scanning is a single pass over
// lines, deliberately separated from HTML emission: a block's source range is
// decided by the scanner alone and never adjusted while generating markup.
//
// Line numbers are 0-indexed and INCLUSIVE at both ends:
//   data-md-line = first source line of the block
//   data-md-end  = last source line of the block
// ===========================================================================

export const MD_NOTE_TYPE = 'HARRY';

const CALLOUT_RE = new RegExp(`^>\\s*\\[!${MD_NOTE_TYPE}\\]\\s?(.*)$`, 'i');
const QUOTE_LINE_RE = /^>\s?(.*)$/;
const ATX_RE = /^(#{1,6})\s+(.*)$/;
const FENCE_RE = /^(```|~~~)(.*)$/;
const HR_RE = /^(?:\s*[-*_]){3,}\s*$/;
const UL_RE = /^(\s*)([-*+])\s+(.*)$/;
const OL_RE = /^(\s*)(\d{1,9})[.)]\s+(.*)$/;

// Sentinel for extracted code spans. U+0000 cannot appear in Markdown text
// that reached us from a file read, so it cannot collide with content — and
// unlike a space-delimited placeholder it never perturbs the surrounding text.
const CODE_OPEN = '\u0000';
const CODE_CLOSE = '\u0001';

export function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Only http(s) and mailto survive an explicit scheme; relative and in-page
// targets pass through untouched. Anything else becomes inert text, so a
// javascript: or data: link committed into a vault note can never go live in
// the review surface.
function safeUrl(raw) {
  const url = String(raw || '').trim();
  const probe = url.replace(/[\u0000-\u0020\u007f]+/g, '');
  const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(probe);
  if (!scheme) return url;
  const name = scheme[1].toLowerCase();
  return name === 'http' || name === 'https' || name === 'mailto' ? url : null;
}

// Inline marks, applied to escaped text. Code spans are lifted out first and
// restored last so their contents are never parsed as emphasis or links.
export function renderInline(text) {
  const codes = [];
  let out = String(text).replace(/`([^`]+)`/g, (_, code) => {
    codes.push(code);
    return `${CODE_OPEN}${codes.length - 1}${CODE_CLOSE}`;
  });
  out = escapeHtml(out);
  out = out.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (whole, alt, href) => {
    const url = safeUrl(href);
    return url === null ? escapeHtml(whole) : `<img src="${escapeHtml(url)}" alt="${alt}">`;
  });
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (whole, label, href) => {
    const url = safeUrl(href);
    return url === null ? escapeHtml(whole) : `<a href="${escapeHtml(url)}">${label}</a>`;
  });
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return out.replace(
    new RegExp(`${CODE_OPEN}(\\d+)${CODE_CLOSE}`, 'g'),
    (_, i) => `<code>${escapeHtml(codes[Number(i)])}</code>`,
  );
}

function isBlankLine(line) {
  return /^\s*$/.test(line);
}

function isBlockStart(line) {
  return (
    ATX_RE.test(line) ||
    FENCE_RE.test(line) ||
    QUOTE_LINE_RE.test(line) ||
    UL_RE.test(line) ||
    OL_RE.test(line) ||
    HR_RE.test(line)
  );
}

/** Flat list of block descriptors with exact source ranges. */
export function scanBlocks(lines) {
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (isBlankLine(line)) { i += 1; continue; }

    const fence = FENCE_RE.exec(line);
    if (fence) {
      const marker = fence[1];
      let end = lines.length - 1;
      for (let j = i + 1; j < lines.length; j += 1) {
        if (lines[j].startsWith(marker)) { end = j; break; }
      }
      blocks.push({ type: 'code', start: i, end, info: fence[2].trim(), body: lines.slice(i + 1, end) });
      i = end + 1;
      continue;
    }

    if (HR_RE.test(line) && !UL_RE.test(line)) {
      blocks.push({ type: 'hr', start: i, end: i });
      i += 1;
      continue;
    }

    const atx = ATX_RE.exec(line);
    if (atx) {
      blocks.push({ type: 'heading', start: i, end: i, level: atx[1].length, text: atx[2].trim() });
      i += 1;
      continue;
    }

    if (QUOTE_LINE_RE.test(line)) {
      let end = i;
      while (end + 1 < lines.length && QUOTE_LINE_RE.test(lines[end + 1])) end += 1;
      const raw = lines.slice(i, end + 1);
      const callout = CALLOUT_RE.exec(raw[0]);
      if (callout) {
        blocks.push({ type: 'callout', start: i, end, ...parseCalloutBody(callout[1], raw.slice(1)) });
      } else {
        blocks.push({ type: 'quote', start: i, end, lines: raw.map((l) => QUOTE_LINE_RE.exec(l)[1]) });
      }
      i = end + 1;
      continue;
    }

    if (UL_RE.test(line) || OL_RE.test(line)) {
      const ordered = !UL_RE.test(line);
      let end = i;
      while (end + 1 < lines.length) {
        const next = lines[end + 1];
        const after = lines[end + 2];
        // A blank line ends the list unless another item follows it, so loose
        // lists keep their separators without swallowing the next paragraph.
        if (isBlankLine(next)) {
          if (after === undefined || (!UL_RE.test(after) && !OL_RE.test(after))) break;
          end += 2;
          continue;
        }
        if (!UL_RE.test(next) && !OL_RE.test(next)) break;
        end += 1;
      }
      const items = [];
      for (let j = i; j <= end; j += 1) {
        const m = UL_RE.exec(lines[j]) || OL_RE.exec(lines[j]);
        if (m) items.push({ line: j, text: m[3] });
      }
      blocks.push({ type: 'list', start: i, end, ordered, items });
      i = end + 1;
      continue;
    }

    let end = i;
    while (end + 1 < lines.length && !isBlankLine(lines[end + 1]) && !isBlockStart(lines[end + 1])) {
      end += 1;
    }
    blocks.push({ type: 'paragraph', start: i, end, text: lines.slice(i, end + 1).join('\n') });
    i = end + 1;
  }
  return blocks;
}

// `> [!HARRY] instruction`, continuation lines, and the agent's channel back:
// `status:` and `reply:` reuse the same vocabulary as the HTML handoff.
function parseCalloutBody(firstLine, restLines) {
  const textParts = [];
  if (firstLine.trim()) textParts.push(firstLine.trim());
  let status = '';
  let reply = '';
  for (const raw of restLines) {
    const inner = QUOTE_LINE_RE.exec(raw)[1];
    const statusMatch = /^status:\s*(.*)$/i.exec(inner);
    if (statusMatch) { status = statusMatch[1].trim(); continue; }
    const replyMatch = /^reply:\s*(.*)$/i.exec(inner);
    if (replyMatch) { reply = replyMatch[1].trim(); continue; }
    if (inner.trim()) textParts.push(inner.trim());
  }
  return { text: textParts.join(' '), status, reply };
}

function attrs(block) {
  return ` data-md-line="${block.start}" data-md-end="${block.end}"`;
}

function renderBlockHtml(block) {
  switch (block.type) {
    case 'heading':
      return `<h${block.level}${attrs(block)}>${renderInline(block.text)}</h${block.level}>`;
    case 'paragraph':
      return `<p${attrs(block)}>${renderInline(block.text)}</p>`;
    case 'hr':
      return `<hr${attrs(block)}>`;
    case 'code':
      return `<pre${attrs(block)}><code>${escapeHtml(block.body.join('\n'))}</code></pre>`;
    case 'quote':
      return `<blockquote${attrs(block)}>${renderInline(block.lines.join('\n'))}</blockquote>`;
    case 'list': {
      const tag = block.ordered ? 'ol' : 'ul';
      const items = block.items
        .map((it) => `<li data-md-line="${it.line}" data-md-end="${it.line}">${renderInline(it.text)}</li>`)
        .join('');
      return `<${tag}${attrs(block)}>${items}</${tag}>`;
    }
    default:
      return '';
  }
}

/**
 * Render Markdown into an anchoring surface.
 *
 * Returns { html, notes, blocks }. `notes` describes every callout in the
 * source, each already bound to the block it annotates — the host page stamps
 * those onto the DOM as editor annotation attributes, which is what makes a
 * saved note reappear as a note rather than as visible content.
 */
export function renderMarkdown(text) {
  const lines = String(text).split('\n');
  const blocks = scanBlocks(lines);
  const notes = [];
  const contentBlocks = [];

  blocks.forEach((block, index) => {
    if (block.type !== 'callout') { contentBlocks.push(block); return; }
    // A callout annotates the block it FOLLOWS; with nothing before it, the
    // one it precedes. Paired by index in the scanned list, so the binding
    // never depends on rendered text.
    let anchor = null;
    for (let j = index - 1; j >= 0; j -= 1) {
      if (blocks[j].type !== 'callout') { anchor = blocks[j]; break; }
    }
    if (!anchor) {
      for (let j = index + 1; j < blocks.length; j += 1) {
        if (blocks[j].type !== 'callout') { anchor = blocks[j]; break; }
      }
    }
    notes.push({
      text: block.text,
      status: block.status,
      reply: block.reply,
      noteStart: block.start,
      noteEnd: block.end,
      anchorLine: anchor ? anchor.start : null,
      anchorEnd: anchor ? anchor.end : null,
    });
  });

  return { html: contentBlocks.map(renderBlockHtml).join('\n'), notes, blocks: contentBlocks };
}

// ── writeback.js ────────────────────────────────────────────────────
// ===========================================================================
// Markdown writeback (v2.22)
//
// Turns the editor's current annotation state back into Markdown by splicing
// lines into the ORIGINAL source text. There is deliberately no HTML→Markdown
// conversion anywhere: the source string is the truth, the DOM is a
// projection of it, and saving only inserts, replaces, or removes whole lines
// at ranges the renderer recorded.
//
// The one rule that makes this safe: every operation is expressed against the
// ORIGINAL line numbering, then applied in DESCENDING order, so an earlier
// splice can never invalidate a later one's indices.
// ===========================================================================

const BLANK = /^\s*$/;

/** One `> [!HARRY]` block, including its optional agent channel lines. */
export function serializeCallout(note) {
  const body = String(note.text || '').trim().split('\n');
  const lines = [`> [!${MD_NOTE_TYPE}] ${body[0] || ''}`.trimEnd()];
  for (const extra of body.slice(1)) lines.push(`> ${extra}`.trimEnd());
  if (note.status) lines.push(`> status: ${note.status}`);
  if (note.reply) lines.push(`> reply: ${note.reply}`);
  return lines;
}

/** The Markdown source line(s) for an edited block, preserving its syntax. */
export function serializeEdit(edit) {
  const text = String(edit.text == null ? '' : edit.text).trim();
  if (edit.kind === 'heading') return [`${'#'.repeat(edit.level || 1)} ${text}`];
  return text.split('\n');
}

function notesEqual(a, b) {
  return (
    String(a.text || '').trim() === String(b.text || '').trim() &&
    String(a.status || '') === String(b.status || '') &&
    String(a.reply || '') === String(b.reply || '')
  );
}

/**
 * Apply the current annotation and edit state to `source`.
 *
 * `sourceNotes` is what the renderer found in the file; `notes` is what the
 * editor holds now. A note carrying `noteStart` came from the file and is
 * matched back to it by line, because callouts deliberately carry no ids —
 * an id in a vault file is noise a human would have to read around.
 *
 * Returns { text, inserted, updated, removed, edited }.
 */
export function applyMarkdownWriteback(source, { sourceNotes = [], notes = [], edits = [] } = {}) {
  const lines = String(source).split('\n');
  const ops = [];
  const stats = { inserted: 0, updated: 0, removed: 0, edited: 0 };

  const liveByStart = new Map();
  for (const note of notes) {
    if (note.noteStart != null) liveByStart.set(note.noteStart, note);
  }

  // Callouts that were in the file but whose annotation is gone: delete them.
  for (const src of sourceNotes) {
    if (liveByStart.has(src.noteStart)) continue;
    let start = src.noteStart;
    let end = src.noteEnd;
    // Consume the blank line that separated the callout from its block, so
    // repeated add/remove cycles cannot accumulate blank lines.
    if (BLANK.test(lines[end + 1] || '') && BLANK.test(lines[start - 1] || '')) end += 1;
    ops.push({ start, deleteCount: end - start + 1, lines: [], order: start });
    stats.removed += 1;
  }

  notes.forEach((note, index) => {
    const text = String(note.text || '').trim();
    if (!text) return;
    if (note.noteStart != null) {
      const src = sourceNotes.find((s) => s.noteStart === note.noteStart);
      if (src && notesEqual(src, note)) return; // untouched
      ops.push({
        start: note.noteStart,
        deleteCount: note.noteEnd - note.noteStart + 1,
        lines: serializeCallout(note),
        order: index,
      });
      stats.updated += 1;
      return;
    }
    // New note: land it immediately after the block it annotates, separated
    // by a blank line so Obsidian renders it as its own callout rather than
    // gluing it to the preceding block.
    const anchorEnd = note.anchorEnd == null ? lines.length - 1 : note.anchorEnd;
    const insertAt = anchorEnd + 1;
    const payload = serializeCallout(note);
    const needsLeadingBlank = !BLANK.test(lines[anchorEnd] || '');
    const needsTrailingBlank = insertAt < lines.length && !BLANK.test(lines[insertAt] || '');
    ops.push({
      start: insertAt,
      deleteCount: 0,
      lines: [...(needsLeadingBlank ? [''] : []), ...payload, ...(needsTrailingBlank ? [''] : [])],
      order: index,
    });
    stats.inserted += 1;
  });

  for (const edit of edits) {
    ops.push({
      start: edit.start,
      deleteCount: edit.end - edit.start + 1,
      lines: serializeEdit(edit),
      order: -1,
    });
    stats.edited += 1;
  }

  // Descending by target line keeps every remaining op's indices valid. Ties
  // (two new notes on the same block) are applied in reverse creation order
  // so they end up in creation order in the file.
  ops.sort((a, b) => (b.start - a.start) || (b.order - a.order));
  for (const op of ops) lines.splice(op.start, op.deleteCount, ...op.lines);

  return { text: lines.join('\n'), ...stats };
}

// ── host.js ─────────────────────────────────────────────────────────
// ===========================================================================
// Markdown review host (v2.22)
//
// Owns everything the editor deliberately does not know about: opening a
// Markdown file, rendering it into an anchoring surface, stamping saved
// callouts back on as editor annotations, and writing Markdown out again.
//
// The editor↔host contract is two flags and two hooks:
//   host → editor : documentElement.dataset.wfpMarkdown = 'true'  (reduces surface)
//                   window.__wfpMarkdownSink = async () => result (replaces export)
//   editor → host : window.__wfpMarkdownBridge = { reset, refresh }
//
// All chrome lives OUTSIDE <main>. The editor resolves <main> as its flat
// root and findSelectableTarget refuses anything the root does not contain,
// so the toolbar can never be selected or annotated.
// ===========================================================================

const DB_NAME = 'wfp-md-review';
const STORE = 'handles';
const HANDLE_KEY = 'last';

const els = {};
let fileHandle = null;
let sourceText = '';
let sourceNotes = [];
let blockIndex = new Map(); // "start-end" → scanned block (for edit detection)

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function rememberHandle(handle) {
  try {
    const db = await idb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(handle, HANDLE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (_) { /* handle persistence is a convenience, never a hard failure */ }
}

async function recallHandle() {
  try {
    const db = await idb();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (_) {
    return null;
  }
}

async function ensurePermission(handle, mode = 'readwrite') {
  if (!handle || typeof handle.queryPermission !== 'function') return true;
  if ((await handle.queryPermission({ mode })) === 'granted') return true;
  return (await handle.requestPermission({ mode })) === 'granted';
}

function setStatus(message, tone = '') {
  els.status.textContent = message;
  els.status.dataset.tone = tone;
}

function annotationId() {
  return `ann-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

// ---------------------------------------------------------------------------
// Render + stamp
// ---------------------------------------------------------------------------
function renderInto(text) {
  const { html, notes, blocks } = renderMarkdown(text);
  sourceText = text;
  sourceNotes = notes;
  blockIndex = new Map();
  for (const block of blocks) blockIndex.set(`${block.start}-${block.end}`, block);

  if (window.__wfpMarkdownBridge) window.__wfpMarkdownBridge.reset();
  els.doc.innerHTML = html;

  // Saved callouts become live annotations again — this is what stops notes
  // from accumulating as visible blockquotes and keeps the notes panel in
  // sync with the file across sessions.
  for (const note of notes) {
    const target = els.doc.querySelector(
      `[data-md-line="${note.anchorLine}"][data-md-end="${note.anchorEnd}"]`,
    );
    if (!target) continue;
    target.setAttribute('data-wfp-edit-annotation-id', annotationId());
    target.setAttribute('data-wfp-edit-annotation-text', note.text);
    if (note.status) target.setAttribute('data-wfp-edit-annotation-status', note.status);
    if (note.reply) target.setAttribute('data-wfp-edit-annotation-reply', note.reply);
    target.dataset.mdNoteLine = String(note.noteStart);
    target.dataset.mdNoteEnd = String(note.noteEnd);
  }

  if (window.__wfpMarkdownBridge) window.__wfpMarkdownBridge.refresh();
  els.doc.dataset.ready = 'true';
}

// ---------------------------------------------------------------------------
// Collect current state from the DOM
// ---------------------------------------------------------------------------
function collectNotes() {
  return [...els.doc.querySelectorAll('[data-wfp-edit-annotation-id]')]
    .map((el) => ({
      text: el.getAttribute('data-wfp-edit-annotation-text') || '',
      status: el.getAttribute('data-wfp-edit-annotation-status') || '',
      reply: el.getAttribute('data-wfp-edit-annotation-reply') || '',
      anchorEnd: Number(el.dataset.mdEnd),
      noteStart: el.dataset.mdNoteLine === undefined ? null : Number(el.dataset.mdNoteLine),
      noteEnd: el.dataset.mdNoteEnd === undefined ? null : Number(el.dataset.mdNoteEnd),
    }))
    .filter((n) => n.text.trim());
}

// Text edits are intentionally narrow: paragraphs and headings whose SOURCE is
// pure text. Anything with inline markup (a link, bold, code) would lose that
// syntax if we rebuilt its source line from textContent, so those blocks are
// reported as skipped rather than silently flattened.
//
// The plain-text test deliberately runs against the ORIGINAL source, never the
// live DOM: editing a paragraph replaces its children, so `**bold**` has
// already become a bare text node by the time we look — a DOM check would see
// no markup and happily flatten the source.
function isPlainSource(block) {
  return renderInline(block.text) === escapeHtml(block.text);
}

function collectEdits() {
  const edits = [];
  const skipped = [];
  for (const el of els.doc.querySelectorAll('[data-md-line]')) {
    const key = `${el.dataset.mdLine}-${el.dataset.mdEnd}`;
    const block = blockIndex.get(key);
    if (!block || (block.type !== 'paragraph' && block.type !== 'heading')) continue;
    const current = el.textContent.replace(/\s+/g, ' ').trim();
    const original = String(block.text).replace(/\s+/g, ' ').trim();
    if (current === original) continue;
    if (!isPlainSource(block)) {
      skipped.push(original.slice(0, 40));
      continue;
    }
    edits.push({
      start: block.start,
      end: block.end,
      kind: block.type,
      level: block.level,
      text: el.textContent.trim(),
    });
  }
  return { edits, skipped };
}

// ---------------------------------------------------------------------------
// Save
// ---------------------------------------------------------------------------
async function save() {
  if (!fileHandle) return { ok: false, message: 'No file open' };
  if (!(await ensurePermission(fileHandle))) return { ok: false, message: 'Write permission denied' };

  // The agent writes these files constantly. Refuse rather than clobber if the
  // file changed underneath us since it was rendered.
  const onDisk = await (await fileHandle.getFile()).text();
  if (onDisk !== sourceText) {
    return { ok: false, message: 'File changed on disk — reopen before saving' };
  }

  const notes = collectNotes();
  const { edits, skipped } = collectEdits();
  const result = applyMarkdownWriteback(sourceText, { sourceNotes, notes, edits });

  const writable = await fileHandle.createWritable();
  await writable.write(result.text);
  await writable.close();

  // Re-render so line numbers match the file again; a second save against
  // stale numbers would splice into the wrong place.
  renderInto(result.text);

  const parts = [];
  if (result.inserted) parts.push(`${result.inserted} added`);
  if (result.updated) parts.push(`${result.updated} updated`);
  if (result.removed) parts.push(`${result.removed} removed`);
  if (result.edited) parts.push(`${result.edited} edited`);
  let message = parts.length ? `Saved — ${parts.join(', ')}` : 'Saved — no changes';
  if (skipped.length) message += ` · ${skipped.length} formatted block(s) left untouched`;
  return { ok: true, message };
}

async function openFile(handle) {
  const picked = handle || (await window.showOpenFilePicker({
    types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown'] } }],
    multiple: false,
  }))[0];
  if (!(await ensurePermission(picked))) { setStatus('Permission denied', 'error'); return; }
  fileHandle = picked;
  await rememberHandle(picked);
  const text = await (await picked.getFile()).text();
  renderInto(text);
  els.name.textContent = picked.name;
  document.title = `${picked.name} — review`;
  setStatus(`${sourceNotes.length} note${sourceNotes.length === 1 ? '' : 's'} in file`);
  loadEditor();
}

let editorLoaded = false;
function loadEditor() {
  if (editorLoaded) return;
  editorLoaded = true;
  document.documentElement.dataset.wfpMarkdown = 'true';
  const script = document.createElement('script');
  script.src = els.doc.dataset.editorSrc || '../editor.js';
  document.body.appendChild(script);
}

// The editor calls this instead of writing HTML when Markdown mode is on.
window.__wfpMarkdownSink = async function markdownSink() {
  try {
    const result = await save();
    setStatus(result.message, result.ok ? 'ok' : 'error');
    return result;
  } catch (error) {
    setStatus(`Save failed: ${error.message}`, 'error');
    return { ok: false, message: error.message };
  }
};

// Everything except file I/O, exposed for tests: the File System Access
// picker cannot be driven by automation, so coverage drives the render →
// annotate → writeback path directly and the picker is verified by hand.
window.__wfpMarkdownHost = {
  renderInto,
  collectNotes,
  collectEdits,
  writeback: () => {
    const { edits } = collectEdits();
    return applyMarkdownWriteback(sourceText, { sourceNotes, notes: collectNotes(), edits });
  },
  get source() { return sourceText; },
};

function boot() {
  els.doc = document.getElementById('md-doc');
  els.status = document.getElementById('md-status');
  els.name = document.getElementById('md-name');
  document.getElementById('md-open').addEventListener('click', () => openFile().catch((e) => setStatus(e.message, 'error')));
  document.getElementById('md-save').addEventListener('click', () => window.__wfpMarkdownSink());

  if (!window.showOpenFilePicker) {
    setStatus('This browser has no File System Access API — use Chrome or Edge', 'error');
    return;
  }
  recallHandle().then(async (handle) => {
    if (!handle) { setStatus('Open a Markdown file to begin'); return; }
    const reopen = document.getElementById('md-reopen');
    reopen.hidden = false;
    reopen.textContent = `Reopen ${handle.name}`;
    reopen.addEventListener('click', () => openFile(handle).catch((e) => setStatus(e.message, 'error')));
    setStatus('Open a Markdown file to begin');
  });
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
